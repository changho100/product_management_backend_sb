<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>제품 목록</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-list"></i> 제품 목록
                        <span th:if="${keyword}" class="text-muted fs-6">
                            - 검색결과: "<span th:text="${keyword}"></span>"
                        </span>
                    </h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        <i class="fas fa-plus"></i> 제품 추가
                    </button>
                </div>
                
                <!-- 검색 폼 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/products/search}" method="get" class="row g-3">
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="keyword" 
                                       th:value="${keyword}" placeholder="제품명으로 검색...">
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-outline-secondary w-100">
                                    <i class="fas fa-search"></i> 검색
                                </button>
                            </div>
                        </form>
                        <div class="mt-2">
                            <a href="/products" class="btn btn-sm btn-link">전체 목록 보기</a>
                        </div>
                    </div>
                </div>
                
                <!-- 제품 목록 -->
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(products)}" class="text-center py-4">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <p class="text-muted">등록된 제품이 없습니다.</p>
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(products)}" class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>제품명</th>
                                        <th>설명</th>
                                        <th>가격</th>
                                        <th>수량</th>
                                        <th>등록일</th>
                                        <th>작업</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${products}">
                                        <td th:text="${product.id}"></td>
                                        <td>
                                            <a th:href="@{/products/{id}(id=${product.id})}" 
                                               class="text-decoration-none fw-bold"
                                               th:text="${product.name}"></a>
                                        </td>
                                        <td th:text="${#strings.abbreviate(product.description, 50)}"></td>
                                        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                                        <td>
                                            <span class="badge bg-info" th:text="${product.quantity} + '개'"></span>
                                        </td>
                                        <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <a th:href="@{/products/{id}(id=${product.id})}" 
                                               class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <form th:action="@{/products/{id}/delete(id=${product.id})}" 
                                                  method="post" class="d-inline"
                                                  onsubmit="return confirm('정말 삭제하시겠습니까?')">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 제품 추가 모달 -->
        <div class="modal fade" id="addProductModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-plus"></i> 새 제품 추가
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/products}" th:object="${newProduct}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="name" class="form-label">제품명 *</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">설명</label>
                                <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="price" class="form-label">가격 *</label>
                                        <input type="number" class="form-control" id="price" 
                                               th:field="*{price}" step="0.01" min="0" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="quantity" class="form-label">수량 *</label>
                                        <input type="number" class="form-control" id="quantity" 
                                               th:field="*{quantity}" min="0" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 저장
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
